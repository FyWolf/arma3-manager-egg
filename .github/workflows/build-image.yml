name: Build image

# Publishes ghcr.io/<owner>/arma3-manager-egg.
#
# Only from `main`, and only after the entrypoint tests pass — the image is what
# customers actually run, and a status file that does not parse is invisible
# until somebody watches a download.

on:
  push:
    branches: [main]
    paths:
      - 'image/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  test:
    name: Entrypoint tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n image/entrypoint.sh
      - run: bash tests/status-json.sh

  build:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased because a GHCR repository name must be, and a GitHub username
      # need not be — "FyWolf" pushed verbatim is rejected by the registry.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/arma3-manager-egg" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./image
          file: ./image/Dockerfile
          # Arma 3 servers are x86-64 only — the binary does not exist for arm64,
          # so a second platform would publish an image that cannot run a server.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo '`${{ steps.image.outputs.name }}:latest`'
            echo ""
            echo "Pinned: \`${{ steps.image.outputs.name }}:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
